# Un solo servidor para todo el frontend: la landing en la raíz, el panel
# bajo /panel/, y /api/ proxeado al core — mismo origen para las tres cosas,
# así el botón "Ingresar" de la landing es un link relativo sin CORS de por
# medio y el panel no necesita saber en qué dominio vive.
#
# El host `core` lo resuelve la red interna del compose. En un deploy con
# Traefik esto sigue valiendo: todo está en la misma red.

upstream core_upstream {
    server core:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── API del panel ────────────────────────────────────────────────────────
    # Sin esto el panel necesitaría VITE_API_URL en tiempo de build y CORS en
    # el core. Con el proxy, el navegador ve un solo origen para todo.
    location /api/ {
        proxy_pass http://core_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    35s;   # el core corta a los 30s
    }

    # Health del core a través del front: útil para depurar el proxy sin
    # entrar al contenedor.
    location = /api-health {
        proxy_pass http://core_upstream/health;
    }

    # ── Panel (/panel/) ─────────────────────────────────────────────────────
    location /panel/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cualquier ruta del router del panel (/panel/agenda, /panel/cierre, …)
    # devuelve el index del panel. Nunca se cachea: es el único que sabe qué
    # hash de assets hay que pedir.
    location /panel/ {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri $uri/ /panel/index.html;
    }

    # ── Landing (raíz) ──────────────────────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
