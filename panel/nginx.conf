# nginx del panel: sirve el bundle estático y proxya la API al core.
#
# El host `core` lo resuelve la red interna del compose. En un deploy con
# Traefik esto sigue valiendo: el panel y el core están en la misma red.

upstream core_upstream {
    # `core` es el nombre del servicio en docker-compose.yml.
    server core:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El core ya manda los suyos; acá van los del contenido estático.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── API ──────────────────────────────────────────────────────────────────
    # Sin esto el panel necesitaría VITE_API_URL en tiempo de build y CORS en
    # el core. Con el proxy, el navegador ve un solo origen.
    location /api/ {
        proxy_pass http://core_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    35s;   # el core corta a los 30s
    }

    # Health del core a través del panel: útil para depurar el proxy sin
    # entrar al contenedor.
    location = /api-health {
        proxy_pass http://core_upstream/health;
    }

    # ── Estáticos ────────────────────────────────────────────────────────────
    # Los assets de Vite llevan hash en el nombre: cambian de nombre cuando
    # cambia el contenido, así que se cachean un año sin riesgo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA ──────────────────────────────────────────────────────────────────
    # Cualquier ruta del router (/agenda, /cierre, …) devuelve el index.
    # El index NUNCA se cachea: es el único que sabe qué hash hay que pedir.
    location / {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
